services:
  - type: web
    name: tony-event-platform
    env: node
    plan: starter
    buildCommand: ""
    startCommand: "npm start"
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHISH_PAYMENT_NUMBER
        sync: false
      - key: BANK_PAYMENT_DETAILS
        sync: false
