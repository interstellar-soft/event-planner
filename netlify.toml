# This project is now a dynamic Node app. Netlify Drop/static hosting is not enough.
# Use Render, Railway, Fly.io, or a VPS with `npm start`.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
